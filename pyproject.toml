[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "porectracks"
dynamic = ["version"]
description = "Pore-C contact distributions as genomic tracks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyBigWig>=0.3.22", "matplotlib>=3.7"]

[project.scripts]
porectracks = "porectracks.cli:main"

[project.urls]
Repository = "https://github.com/wyqmath/PoreCTracks"

[tool.setuptools.packages.find]
where = ["src"]
include = ["porectracks*"]

[tool.setuptools.dynamic]
version = {attr = "porectracks.__version__"}
